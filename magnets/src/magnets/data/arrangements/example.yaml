# A worked example: set and get lines stack on each other in every order,
# and the literal flip pair's two sides line up in every order, under a
# top-to-bottom flip.
flip: top_bottom
classes:
  set:
    top:
      - {from: left, at: 0.25, layers: F/F}
    bottom:
      - {from: left, at: 0.25, layers: N/S}
  get:
    top:
      - {from: left, at: 0.25, layers: F/F}
    bottom:
      - {from: left, at: 0.25, layers: N/S}
  literal:
    left:
      - {at: 0.5, layers: F/F}
    right:
      - {at: 0.5, layers: N/S}
