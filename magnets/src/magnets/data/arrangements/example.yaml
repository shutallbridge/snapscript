# A worked example: simple_head and get lines stack on each other in every order,
# and the literal flip pair's two sides line up in every order, under a
# top-to-bottom flip.
flip: top_bottom
classes:
  simple_head:
    top:
      - {from: left, at: 1/6, layers: F/F}
    bottom:
      - {from: left, at: 1/6, layers: N/S}
  get:
    top:
      - {from: left, at: 1/6, layers: F/F}
    bottom:
      - {from: left, at: 1/6, layers: N/S}
  literal:
    left:
      - {at: 1/2, layers: F/F}
    right:
      - {at: 1/2, layers: N/S}
