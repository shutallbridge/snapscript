# Grammar rules: which contacts must snap (connect), may not snap (forbid),
# or must not push apart (coexist). See issue #10.

# The roles an edge can have: what a card needs on its left and top, and
# what it accepts on its right and below.
roles:
  left: [value, call, cont, required, optional, head]
  right: [open, call, value, params, default, end]
  top: [line, dedent, top_level, none, free]
  bottom: [line, block, none, free]

# Forbid priorities and their weights in the solver's objective.
priorities: {should: 10, nice: 1, low: 0}

# Horizontal: the left card's right edge facing the right card's left edge.
horizontal:
  # At offset 0, each right role connects to these left roles.
  connect:
    open: [value, call]
    call: [value, call, cont, optional]
    value: [value, call, cont, optional]
    params: [required, optional]
    default: [value, call, optional]
    end: []
  # Every other pair at offset 0 is forbid with this priority.
  forbid: should
  # Any other offset where pockets can align is forbid with this priority.
  off_line: low

# Vertical: the upper card's bottom edge facing the lower card's top edge,
# at offset = lower's left end - upper's left end, in U.
vertical:
  # Where the next line head can sit: the same column, 1U right after a
  # block head, or 1U left for a [dedent].
  offsets: [-1, 0, 1]
  # At those offsets, these (upper bottom role, lower top role, offset)
  # connect.
  connect:
    - {upper: line, lower: line, offset: 0}
    - {upper: block, lower: line, offset: 1}
    - {upper: line, lower: dedent, offset: -1}
  # Every other pair at those offsets is forbid, with the priority of the
  # rule here that matches it, or else `forbid`. A rule without `upper`,
  # `lower` or `offset` matches any; a pair may match at most one rule.
  priorities:
    - {lower: top_level, priority: nice}  # top_level cards should have nothing above them
    - {upper: block, lower: dedent, offset: 0, priority: nice}  # an empty body
  forbid: should
  # Any other offset is forbid with this priority, unless it is coexist.
  off_line: low
  # Contacts where either facing role is one of these are not graded.
  ungraded: [free]
  # Coexist: in a legal program, cards that touch without being neighbours
  # must not push apart. A contact at a whole-U offset coexists if neither
  # facing role is in `never`, no connect claims it, and either the upper
  # card can head a line, the lower can sit inline and offset >= +1 (+2 if
  # the upper's bottom role is in `indents`); or the upper can sit inline,
  # the lower can head a line and offset <= -1 (-2 if the lower's top role
  # is in `outdents`); or both can sit inline.
  coexist:
    never: [top_level, free]
    # A card can head a line if its top role is one of these.
    line_heads: [line, dedent]
    # A card can sit inline unless its left role is one of these.
    not_inline: [head]
    # The next line head sits 1U right of a line head with one of these
    # bottom roles: a block's body is indented.
    indents: [block]
    # A line head with one of these top roles sits 1U left of the line
    # above it: a [dedent].
    outdents: [dedent]
