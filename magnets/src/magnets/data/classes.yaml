# Card classes: one physical card design each (see issue #10).
#
# A class lists its sides: one side, or two for a flip pair (`flip_pair: true`).
# The first side is the front; a flip pair's second side is its back, derived
# from the front by the flip. Each side lists its member cards in notation,
# each with the roles of its four edges. Every member of a class side must
# have the same roles. The roles are listed in rules.yaml.
#
# A flip pair's two sides list their members in the same order: each card has
# the n-th front member on one side and the n-th back member on the other, so
# `[*]` is on the back of `[/]`. Both sides of each flip pair here take the
# same roles (ADR 0003): a pair whose sides differ ties some illegal
# neighbours to legal ones, so they always snap.
#
# A member's notation is also the pattern a card text in a program must
# match: anything in `{…}` stands for handwriting and a `(…)` for printed or
# typed text. A card matches whichever bracket it uses, so `[get{x}]` matches
# `[get{score}]` and `[get(p5.frameCount)]`, and `[call{f}]` matches
# `[call(print)]`. Every card text must match exactly one class; a text that
# matches both sides of a flip pair resolves to the front. Both sides take the
# same roles, so the side can't change whether a program is legal.
#
# `id` is the class ID, a whole number from 0 to 31 (5 bits), unique to the
# class. It is shown on the class's printed frames and starts their file
# names, so changing it makes frames already printed read as another class.
# Each language version sets the IDs; in 0.x they may change between
# versions. As the ID isn't the class's place here, a class can go next to
# its relatives without renumbering the others.
# The ID names the class, not its magnets, so the arrangement doesn't hold it.
#
# `min_length` is the shortest card of the class, in whole U: most cards hold
# written text, which needs 2U. Which one-symbol cards (`[(]`, `[+]`, …) may be
# 1U is TBD, decided with the marker (#26, #32). `pocket_reach` keeps a top or
# bottom pocket near its end: it sits less than the reach from its end of the
# card. Block heads, `[elif]`, `[else]` and `[dedent]` reach 2U, for the
# indent pocket.

# `[set{x}to]` and `[return]` head a line without opening a block, unlike
# the block heads. `[return]` takes the roles of `[set{x}to]`, so it shares
# its card design, as `[if]` shares `[for{x}in]`'s. Having nothing to its
# right is a language matter, not a contact.
simple_head:
  id: 0
  min_length: 2
  pocket_reach: 1
  sides:
    head:
      "[set{x}to]": {left: head, right: open, top: line, bottom: line}
      "[return]": {left: head, right: open, top: line, bottom: line}

# A printed card and the same card handwritten mean the same thing, so they
# share a class, and one member stands for both: `[get{x}]` matches the
# printed `[get(p5.frameCount)]`, as `[call{f}]` matches `[call(p5.circle)]`.
# `[root]` takes the roles of `[get{x}]`.
get:
  id: 1
  min_length: 2
  pocket_reach: 1
  sides:
    get:
      "[get{x}]": {left: value, right: value, top: line, bottom: line}
      "[root]": {left: value, right: value, top: line, bottom: line}

define:
  id: 2
  min_length: 2
  pocket_reach: 1
  sides:
    define:
      "[define{f}]": {left: head, right: params, top: top_level, bottom: line}

call:
  id: 3
  min_length: 2
  pocket_reach: 1
  sides:
    call:
      "[call{f}]": {left: call, right: call, top: line, bottom: line}

set_prop:
  id: 4
  min_length: 2
  pocket_reach: 1
  sides:
    set_prop:
      "[setProp{p}to]": {left: cont, right: open, top: none, bottom: none}

get_prop:
  id: 5
  min_length: 2
  pocket_reach: 1
  sides:
    get_prop:
      "[getProp{p}]": {left: cont, right: value, top: none, bottom: none}

required:
  id: 6
  min_length: 2
  pocket_reach: 1
  sides:
    required:
      "[required{p}]": {left: required, right: params, top: none, bottom: none}

optional:
  id: 7
  min_length: 2
  pocket_reach: 1
  sides:
    optional:
      "[optional{p}]": {left: optional, right: default, top: none, bottom: none}

literal:
  id: 8
  min_length: 2
  pocket_reach: 1
  flip_pair: true
  sides:
    num:
      "[num{…}]": {left: value, right: value, top: none, bottom: none}
    str:
      "[str{…}]": {left: value, right: value, top: none, bottom: none}

bool:
  id: 9
  min_length: 2
  pocket_reach: 1
  flip_pair: true
  sides:
    "true":
      "[bool(true)]": {left: value, right: value, top: none, bottom: none}
    "false":
      "[bool(false)]": {left: value, right: value, top: none, bottom: none}

# A color card has a different color on each side; which two is the kit's
# choice, so both sides are written `[color(…)]` and a color resolves to the
# front.
color:
  id: 10
  min_length: 2
  pocket_reach: 1
  flip_pair: true
  sides:
    front:
      "[color(…)]": {left: value, right: value, top: none, bottom: none}
    back:
      "[color(…)]": {left: value, right: value, top: none, bottom: none}

none:
  id: 11
  min_length: 2
  pocket_reach: 1
  sides:
    none:
      "[none]": {left: value, right: value, top: none, bottom: none}

block_head:
  id: 12
  min_length: 2
  pocket_reach: 2
  sides:
    head:
      "[if]": {left: head, right: open, top: line, bottom: block}
      "[repeat]": {left: head, right: open, top: line, bottom: block}
      "[for{x}in]": {left: head, right: open, top: line, bottom: block}

# `[elif]` and `[else]` continue an `[if]` chain in its column: each closes
# the block above it, as a `[dedent]` does, and opens its own, as a block
# head does. Neither can share a class: their tops differ from the block
# heads' and their bottoms from `[dedent]`'s, and their right roles differ,
# so they can't be a flip pair (ADR 0003). Their length is TBD, decided with
# a card design.
#
# The magnets can't tell an `[if]` body from a `[repeat]` or `[for{x}in]`
# body, or an `[elif]` block from an `[else]` block, so an `[elif]` or
# `[else]` after a `[repeat]` or `[for{x}in]` body, and an `[elif]` after an
# `[else]`, snap: they are SyntaxErrors that aren't physically enforced.
elif:
  id: 23
  min_length: 2
  pocket_reach: 2
  sides:
    elif:
      "[elif]": {left: head, right: open, top: dedent, bottom: block}

else:
  id: 24
  min_length: 2
  pocket_reach: 2
  sides:
    else:
      "[else]": {left: head, right: end, top: dedent, bottom: block}

dedent:
  id: 13
  min_length: 2
  pocket_reach: 2
  sides:
    dedent:
      "[dedent]": {left: head, right: end, top: dedent, bottom: line}

"on":
  id: 14
  min_length: 2
  pocket_reach: 1
  sides:
    "on":
      "[on(…)]": {left: head, right: end, top: top_level, bottom: line}

operator:
  id: 15
  min_length: 2
  pocket_reach: 1
  flip_pair: true
  sides:
    front:
      "[+]": {left: cont, right: open, top: none, bottom: none}
      "[*]": {left: cont, right: open, top: none, bottom: none}
      "[<]": {left: cont, right: open, top: none, bottom: none}
      "[<=]": {left: cont, right: open, top: none, bottom: none}
      "[==]": {left: cont, right: open, top: none, bottom: none}
      "[and]": {left: cont, right: open, top: none, bottom: none}
    back:
      "[-]": {left: cont, right: open, top: none, bottom: none}
      "[/]": {left: cont, right: open, top: none, bottom: none}
      "[>]": {left: cont, right: open, top: none, bottom: none}
      "[>=]": {left: cont, right: open, top: none, bottom: none}
      "[!=]": {left: cont, right: open, top: none, bottom: none}
      "[or]": {left: cont, right: open, top: none, bottom: none}

modulo:
  id: 16
  min_length: 2
  pocket_reach: 1
  sides:
    modulo:
      "[%]": {left: cont, right: open, top: none, bottom: none}

# `[not]` takes the roles of `[(]`: it sits where a value goes and needs a
# value next.
"not":
  id: 17
  min_length: 2
  pocket_reach: 1
  sides:
    "not":
      "[not]": {left: value, right: open, top: none, bottom: none}

open_paren:
  id: 18
  min_length: 2
  pocket_reach: 1
  sides:
    open:
      "[(]": {left: value, right: open, top: none, bottom: none}

close_paren:
  id: 19
  min_length: 2
  pocket_reach: 1
  sides:
    close:
      "[)]": {left: cont, right: value, top: none, bottom: none}

import:
  id: 20
  min_length: 2
  pocket_reach: 1
  sides:
    import:
      "[import(…)as(…)]": {left: head, right: end, top: free, bottom: free}
      "[import(…)]": {left: head, right: end, top: free, bottom: free}

extern:
  id: 21
  min_length: 2
  pocket_reach: 1
  sides:
    extern:
      "[extern(…)]": {left: head, right: params, top: free, bottom: free}

global:
  id: 22
  min_length: 2
  pocket_reach: 1
  sides:
    global:
      "[global{x}]": {left: head, right: open, top: free, bottom: free}
