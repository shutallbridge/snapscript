<!doctype html>
<!-- PROTOTYPE (#92), throwaway. Three variants of the assembly page, switchable via ?variant=A|B|C
     and the floating bar; ?run=example|full picks the arrangement. Built by build.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE assembly page</title>
<style>
  :root { --N: #d9342b; --S: #2563eb; --empty: #b9b9b9; --ink: #1d1d1f; --mute: #6b6b70; --line: #d6d6db; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink); background: #fafafa; }
  main { padding: 24px 28px 110px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  .mute { color: var(--mute); }
  .N { color: var(--N); } .S { color: var(--S); } .E { color: var(--empty); }
  code { font: 13px ui-monospace, Menlo, monospace; }
  .msg { border: 1px solid #f0c36d; background: #fff8e6; padding: 10px 14px; border-radius: 8px; margin: 10px 0; max-width: 620px; }
  .msg.bad { border-color: #e9a0a0; background: #fff0f0; }
  .pill { display: inline-block; min-width: 22px; padding: 1px 6px; border-radius: 10px; color: #fff; font-weight: 700; text-align: center; font-size: 12px; }
  .pill.N { background: var(--N); } .pill.S { background: var(--S); } .pill.E { background: #eee; color: #999; }
  button, select, input { font: inherit; }
  svg text { font-family: system-ui, sans-serif; }
  .cell { cursor: pointer; }

  /* switcher: deliberately not part of the design */
  #switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: #111; color: #fff; padding: 8px 12px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 10; font-size: 13px; }
  #switcher button { white-space: nowrap; background: #333; color: #fff; border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  #switcher button.on { background: #f5c518; color: #111; }
  #switcher .lbl { min-width: 210px; text-align: center; font-weight: 600; }
  #switcher .sep { width: 1px; height: 18px; background: #555; }

  /* A */
  .A-wrap { display: flex; gap: 28px; align-items: flex-start; }
  .A-panel { width: 360px; }
  .A-len { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  .A-len input { width: 56px; padding: 4px; text-align: center; }

  /* B */
  .B-beam { display: inline-flex; flex-direction: column; align-items: stretch; margin: 6px 0 4px; }
  .B-cells { display: flex; border: 2px solid #555; border-bottom: 0; background: #e6e2da; }
  .B-cells button { width: 58px; height: 58px; border: 0; border-right: 2px solid #555; background: transparent; cursor: pointer; padding: 0; }
  .B-cells button:last-child { border-right: 0; }
  .B-base { height: 8px; background: #555; }
  .B-bitnums { display: flex; } .B-bitnums span { width: 58px; text-align: center; font-size: 11px; color: var(--mute); }
  .B-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .B-walls { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 10px; }
  .B-orient { display: flex; gap: 24px; align-items: center; margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; }
  .B-toggle { display: inline-flex; border: 1px solid #999; border-radius: 8px; overflow: hidden; }
  .B-toggle button { border: 0; background: #fff; padding: 6px 14px; cursor: pointer; }
  .B-toggle button.on { background: var(--ink); color: #fff; }
  .B-key { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .B-key span { display: flex; align-items: center; gap: 6px; }
  .B-len { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
  .B-select { position: relative; display: inline-block; }
  .B-select::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; margin-top: -6px;
    border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); pointer-events: none; }
  .B-select select { appearance: none; -webkit-appearance: none; font-size: 18px; font-weight: 600; color: var(--ink); text-transform: none; letter-spacing: 0;
    padding: 8px 40px 8px 14px; border: 1px solid #c8c8cd; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: pointer; }
  .B-select select:hover { border-color: #999; }
  .B-select select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(29,29,31,.12); }
  .B-wall { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

  /* C */
  .C-bits { display: flex; gap: 8px; align-items: flex-end; }
  .C-bit { width: 84px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--mute); }
  .C-bit button { width: 52px; height: 52px; font-size: 22px; font-weight: 700; border-radius: 10px; border: 2px solid #999; background: #fff; cursor: pointer; }
  .C-bit button.one { background: var(--ink); color: #fff; border-color: var(--ink); }
  .C-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 14px 0; }
  table.C { border-collapse: collapse; width: 100%; background: #fff; }
  table.C th, table.C td { border-bottom: 1px solid #eee; padding: 6px 10px; text-align: left; vertical-align: middle; }
  table.C th { font-size: 12px; color: var(--mute); font-weight: 600; }
  table.C tr.wallhead td { background: #f3f3f5; font-weight: 700; }
  table.C tr.emptyrow td { color: #aaa; }
</style>
</head>
<body>
<main id="app"></main>
<div id="switcher"></div>
<script>
const D = /*DATA*/null;
const VARIANTS = { A: "Plan, as held", B: "Walls", C: "Pocket list" };
const KEYS = Object.keys(VARIANTS);
const P = new URLSearchParams(location.search);
const state = {
  variant: KEYS.includes(P.get("variant")) ? P.get("variant") : "A",
  run: D.runs[P.get("run")] ? P.get("run") : "example",
  bits: (P.get("bits") || "00001").split("").map(Number),
  length: 3,
  showEmpty: false,
  view: P.get("view") === "outside" ? "outside" : "inside",
};
const U = 30, W = 30, T = 10, WALL = 2.2, BEAM_X = 20, BEAM_W = 3.2;
const OPP = { N: "S", S: "N", "-": "-" };
const COL = { N: "var(--N)", S: "var(--S)", "-": "var(--empty)" };

// ---------- shared lookup ----------
function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a); }
function frac(n, d) { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? `${n}` : `${n}/${d}`; }
function sixths(n, d) { return (n * 6) / d; } // every position is k/6
function idOf(bits) { return parseInt(bits.join(""), 2); }
function bitsOf(id) { return id.toString(2).padStart(5, "0"); }
function classById(id) { return Object.keys(D.classes).find((n) => D.classes[n].id === id); }

function lookup() {
  const run = D.runs[state.run];
  const id = idOf(state.bits), L = state.length;
  const base = { id, bits: bitsOf(id), L, run };
  const name = classById(id);
  const near = run.built.filter((n) => { const x = D.classes[n].id ^ id; return x && !(x & (x - 1)); });
  if (name === undefined) return { ...base, status: "no-class", near };
  const cls = D.classes[name];
  if (!run.built.includes(name)) return { ...base, status: "not-in-run", name, cls, near };
  if (!Number.isInteger(L) || L < cls.minLength || L > run.maxLength) return { ...base, status: "bad-length", name, cls };
  return { ...base, status: "ok", name, cls, walls: walls(run.fronts[name], L) };
}

// Every position of every edge, with its pocket or null. along: U from the left end (top/bottom) or the top edge (left/right).
function walls(front, L) {
  const out = {};
  for (const edge of ["top", "bottom", "left", "right"]) {
    const long = edge === "top" || edge === "bottom";
    const byKey = {};
    for (const p of front[edge] || []) {
      let [n, d] = p.at;
      if (p.anchor === "right") n = L * d - n;
      byKey[sixths(n, d)] = p;
    }
    const cells = long ? L : 1, list = [];
    for (let u = 0; u < cells; u++) for (const k of [1, 3, 5]) {
      const key = 6 * u + k, p = byKey[key];
      list.push({ edge, key, along: key / 6, text: frac(key, 6), mm: (key / 6) * U, up: p ? p.up : "-", down: p ? p.down : "-", filled: !!p });
    }
    out[edge] = list;
  }
  return out;
}
function count(w) { return Object.values(w).flat().reduce((s, p) => s + (p.up !== "-") + (p.down !== "-"), 0); }
const EDGE_HINT = {
  top: "top edge: on your left as you hold it",
  bottom: "bottom edge: on your right",
  left: "left end: nearest you, the ID beam's end",
  right: "right end: away from you",
};

function problem(r) {
  const built = r.run.built.map((n) => `${n} <code>${bitsOf(D.classes[n].id)}</code>`).join(", ");
  const near = r.near && r.near.length ? `<br>One mark off: ${r.near.map((n) => `<a href="#" data-id="${D.classes[n].id}">${n} <code>${bitsOf(D.classes[n].id)}</code></a>`).join(", ")}.` : "";
  if (r.status === "no-class")
    return `<div class="msg bad"><b>No class has ID <code>${r.bits}</code> (${r.id}).</b> Check the beam: back down, left end toward you, bit 1 at the top-edge end.${near}<br><span class="mute">This run built: ${built}.</span></div>`;
  if (r.status === "not-in-run")
    return `<div class="msg"><b><code>${r.bits}</code> is ${r.name}</b> (${r.cls.members.join(" ")}), but this run built no ${r.name} frames.${near}<br><span class="mute">This run built: ${built}.</span></div>`;
  return `<div class="msg"><b>This run has no ${r.L}U ${r.name} frame.</b> It built ${r.name} from ${r.cls.minLength}U to ${r.run.maxLength}U.</div>`;
}
function title(r) {
  if (r.status !== "ok") return "";
  return `<h1>${r.name} · ${r.L}U <span class="mute" style="font-weight:400">· ID <code>${r.bits}</code> = ${r.id}</span></h1>
    <div class="mute">${r.cls.members.join(" ")}${r.cls.flipPair ? " · flip pair: double-sided frame" : " · single-sided: back built in"} · ${count(r.walls)} magnets</div>`;
}

// ---------- A: plan view, as held ----------
// Looking down on the frame, back down, left end toward you (bottom of the screen), top edge on your left.
function variantA(r) {
  const s = 5, L = Math.max(2, Math.min(8, Number.isInteger(r.L) ? r.L : 2)), Lmm = L * U;
  const ox = 190, oy = 70, fw = W * s, fh = Lmm * s;
  const X = (y) => ox + (W - y) * s; // y across the card, 0 at the bottom edge
  const Y = (x) => oy + (Lmm - x) * s; // x along the card, 0 at the left end
  let g = "";
  g += `<rect x="${ox}" y="${oy}" width="${fw}" height="${fh}" fill="#ece8df" stroke="#555" stroke-width="2" rx="4"/>`;
  g += `<rect x="${ox + WALL * s}" y="${oy + WALL * s}" width="${fw - 2 * WALL * s}" height="${fh - 2 * WALL * s}" fill="${r.cls && r.cls.flipPair ? "#fafafa" : "#f4f1ea"}" stroke="#888"/>`;
  g += `<text x="${ox + fw / 2}" y="${oy - 40}" text-anchor="middle" font-size="12" fill="#666">right end (away from you)</text>`;
  g += `<text x="${ox + fw / 2}" y="${oy + fh + 52}" text-anchor="middle" font-size="12" fill="#666">left end (toward you)</text>`;
  g += `<text x="${ox - 150}" y="${oy + fh / 2}" font-size="12" fill="#666" transform="rotate(-90 ${ox - 150} ${oy + fh / 2})" text-anchor="middle">top edge</text>`;
  g += `<text x="${ox + fw + 150}" y="${oy + fh / 2}" font-size="12" fill="#666" transform="rotate(90 ${ox + fw + 150} ${oy + fh / 2})" text-anchor="middle">bottom edge</text>`;
  // the beam, at its real place, clickable
  const by = Y(BEAM_X) - (BEAM_W * s) / 2, bx0 = ox + WALL * s, bw = (fw - 2 * WALL * s) / 5;
  state.bits.forEach((b, i) => {
    const x = bx0 + i * bw;
    g += `<rect class="cell" data-bit="${i}" x="${x}" y="${by}" width="${bw}" height="${BEAM_W * s}" fill="#d8d2c4" stroke="#555"/>`;
    if (b) g += `<line class="cell" data-bit="${i}" x1="${x + 3}" y1="${by + BEAM_W * s - 2}" x2="${x + bw - 3}" y2="${by + 2}" stroke="#222" stroke-width="2.5"/>`;
  });
  g += `<line x1="${bx0}" y1="${by + BEAM_W * s}" x2="${bx0 + 5 * bw}" y2="${by + BEAM_W * s}" stroke="#222" stroke-width="3"/>`;
  if (r.status === "ok") {
    for (const edge of ["top", "bottom", "left", "right"]) for (const p of r.walls[edge]) g += glyphA(p, X, Y, s, ox, oy, fw, fh);
  } else {
    g += `<text x="${ox + fw / 2}" y="${oy + fh / 2}" text-anchor="middle" font-size="40" fill="#ccc">?</text>`;
  }
  const svg = `<svg width="${ox + fw + 190}" height="${oy + fh + 70}">${g}</svg>`;
  const zoom = state.bits.map((b, i) => `<rect class="cell" data-bit="${i}" x="${i * 52}" y="0" width="52" height="52" fill="#d8d2c4" stroke="#555" stroke-width="2"/>` +
    (b ? `<line class="cell" data-bit="${i}" x1="${i * 52 + 8}" y1="44" x2="${i * 52 + 44}" y2="8" stroke="#222" stroke-width="5"/>` : "") +
    `<text x="${i * 52 + 26}" y="78" text-anchor="middle" font-size="11" fill="#666">bit ${i + 1}</text>`).join("");
  return `<div class="A-wrap"><div>${svg}</div><div class="A-panel">
    <h1 style="margin-top:20px">Which way round?</h1>
    <p class="mute">Hold the frame back down, left end toward you. Tick the beam's marks here or on the drawing.</p>
    <svg width="262" height="86">${zoom}<line x1="0" y1="52" x2="260" y2="52" stroke="#222" stroke-width="5"/></svg>
    <div class="A-len">Length <button data-len="-1">−</button><input id="len" type="number" value="${Number.isInteger(r.L) ? r.L : ""}"><button data-len="1">+</button> U</div>
    ${r.status === "ok" ? title(r) : problem(r)}
    <h2>Reading a pocket</h2>
    <svg width="300" height="70">${legendA()}</svg>
    <p class="mute">Each pocket crosses the wall: the letter <b>outside</b> the frame is the pole facing out of the edge; the letter <b>inside</b> the ring is the face you see as you push the magnet into its bore. Upper row: up layer (the front, toward you); lower row: down layer. <span class="E">–</span> is an empty layer; a tick on the wall alone is solid wall.</p>
  </div></div>`;
}
function cellA(x, y, w, h, pole, dim) {
  const c = pole === "-" ? "#eee" : COL[pole];
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}" opacity="${dim ? 0.55 : 1}"/>` +
    `<text x="${x + w / 2}" y="${y + h / 2 + 4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="${pole === "-" ? "#999" : "#fff"}">${pole === "-" ? "–" : pole}</text>`;
}
function glyphA(p, X, Y, s, ox, oy, fw, fh) {
  const cw = 20, ch = 16, gap = WALL * s + 4;
  let g = "";
  if (p.edge === "top" || p.edge === "bottom") {
    const y = Y(p.mm), wallX = p.edge === "top" ? ox : ox + fw, dir = p.edge === "top" ? -1 : 1; // dir: outward
    g += `<line x1="${wallX - 6}" y1="${y}" x2="${wallX + 6}" y2="${y}" stroke="#555" stroke-width="2"/>`;
    if (!p.filled) return g;
    const outX = dir < 0 ? wallX - 6 - cw : wallX + 6, inX = dir < 0 ? wallX + gap : wallX - gap - cw;
    [["up", p.up, y - ch - 1], ["down", p.down, y + 1]].forEach(([, pole, yy]) => {
      g += cellA(outX, yy, cw, ch, pole) + cellA(inX, yy, cw, ch, OPP[pole], true);
    });
    const tx = dir < 0 ? outX - 6 : outX + cw + 6;
    g += `<text x="${tx}" y="${y + 4}" text-anchor="${dir < 0 ? "end" : "start"}" font-size="11" fill="#666">${p.text} U · ${p.mm} mm</text>`;
  } else {
    const x = ox + p.mm * s, wallY = p.edge === "left" ? oy + fh : oy, dir = p.edge === "left" ? 1 : -1; // along from the top edge = screen left
    g += `<line x1="${x}" y1="${wallY - 6}" x2="${x}" y2="${wallY + 6}" stroke="#555" stroke-width="2"/>`;
    if (!p.filled) return g;
    const outY = dir > 0 ? wallY + 6 : wallY - 6 - ch, inY = dir > 0 ? wallY - gap - ch : wallY + gap;
    [["up", p.up, x - cw / 2 - cw / 2 - 1], ["down", p.down, x + 1]].forEach(([, pole, xx]) => {
      g += cellA(xx, outY, cw, ch, pole) + cellA(xx, inY, cw, ch, OPP[pole], true);
    });
    const ty = dir > 0 ? outY + ch + 13 : outY - 5;
    g += `<text x="${x}" y="${ty}" text-anchor="middle" font-size="11" fill="#666">${p.text} U</text>`;
  }
  return g;
}
function legendA() {
  return `<rect x="110" y="6" width="12" height="58" fill="#555"/>` +
    cellA(84, 18, 20, 16, "N") + cellA(84, 36, 20, 16, "-") + cellA(128, 18, 20, 16, "S", true) + cellA(128, 36, 20, 16, "-", true) +
    `<text x="78" y="31" text-anchor="end" font-size="11" fill="#666">up</text><text x="78" y="49" text-anchor="end" font-size="11" fill="#666">down</text>` +
    `<text x="94" y="12" text-anchor="middle" font-size="10" fill="#666">out</text><text x="138" y="12" text-anchor="middle" font-size="10" fill="#666">in</text>` +
    `<text x="160" y="31" font-size="11" fill="#666">the pocket N/-:</text><text x="160" y="45" font-size="11" fill="#666">up: N out, S in</text><text x="160" y="59" font-size="11" fill="#666">down: empty</text>`;
}

// ---------- B: each wall as seen from inside or outside the ring ----------
// Front up: a wall's up layer is its upper row. The big letter is the face you look at: the in-face from inside, the out-pole from outside.
const B_VIEW = {
  // which end of the wall is on your left, looking at it from inside; from outside it's the mirror image
  left: { name: "Left end wall", leftLabel: "bottom edge", rightLabel: "top edge", reverse: true },
  top: { name: "Top edge wall", leftLabel: "left end", rightLabel: "right end", reverse: false },
  right: { name: "Right end wall", leftLabel: "top edge", rightLabel: "bottom edge", reverse: false },
  bottom: { name: "Bottom edge wall", leftLabel: "right end", rightLabel: "left end", reverse: true },
};
function variantB(r) {
  const run = r.run, inside = state.view === "inside";
  const cells = state.bits.map((b, i) => `<button data-bit="${i}" title="bit ${i + 1}"><svg width="58" height="58">${b ? `<line x1="10" y1="48" x2="48" y2="10" stroke="#222" stroke-width="6" stroke-linecap="round"/>` : ""}</svg></button>`).join("");
  const nums = state.bits.map((_, i) => `<span>${i === 0 ? "1 · top edge" : i === 4 ? "5 · bottom" : i + 1}</span>`).join("");
  const lens = [];
  for (let n = 2; n <= run.maxLength; n++) lens.push(`<option value="${n}" ${n === r.L ? "selected" : ""}>${n}U</option>`);
  let body = r.status === "ok" ? title(r) : problem(r);
  if (r.status === "ok") {
    const toggle = ["inside", "outside"].map((v) => `<button data-view="${v}" class="${state.view === v ? "on" : ""}">From ${v}</button>`).join("");
    const [big, small] = inside ? ["face you push in", "pole facing out"] : ["pole facing out", "face pushed in"];
    const key = (pole, txt, r) => `<svg width="22" height="22"><circle cx="11" cy="11" r="${r}" fill="${COL[pole]}"/><text x="11" y="15" text-anchor="middle" font-size="${r > 8 ? 12 : 9}" font-weight="700" fill="#fff">${pole}</text></svg> ${txt}`;
    body += `<div class="B-orient">${keyPlanB(r.L, inside)}<div>
      <div class="B-toggle">${toggle}</div>
      <p>${inside ? "Looking out from inside the ring." : "Looking in from outside the frame."}</p>
      <div class="B-key"><span>${key("N", "Big: " + big, 10)}</span><span>${key("S", "Small: " + small, 7)}</span><span class="mute">Upper row: up layer · lower row: down layer</span></div></div></div>`;
    body += `<div class="B-walls">${["left", "top", "right", "bottom"].map((e) => wallB(e, r.walls[e], r.L, inside)).join("")}</div>`;
  }
  return `<h1>Magnet poles from the ID beam</h1>
    <div class="B-row">
      <div><div class="mute">Copy the beam: back down, left end toward you, read left to right.</div>
        <div class="B-beam"><div class="B-cells">${cells}</div><div class="B-base"></div><div class="B-bitnums">${nums}</div></div></div>
      <label class="B-len"><span>Length</span><span class="B-select"><select id="lensel">${lens.join("")}</select></span></label>
      <div style="font-size:22px"><code>${r.bits}</code> = ${r.id}</div>
    </div>${body}`;
}
// The frame from above, as held, with a sight-line arrow at each wall: outward from inside the ring, or inward from outside.
function keyPlanB(L, inside) {
  const s = 3.2, w = W * s, h = L * U * s, ox = 150, oy = 74, wl = WALL * s * 1.6;
  const cx = ox + w / 2, cy = oy + h / 2;
  const col = inside ? "#0f8a5f" : "#b0590e";
  // [x, y at the wall, unit vector pointing out of the wall, label]
  const walls = [
    [ox, cy, -1, 0, "Top edge wall"], [ox + w, cy, 1, 0, "Bottom edge wall"],
    [cx, oy + h, 0, 1, "Left end wall"], [cx, oy, 0, -1, "Right end wall"],
  ];
  let g = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker></defs>`;
  g += `<rect x="${ox}" y="${oy}" width="${w}" height="${h}" fill="#d8d2c4" stroke="#555" stroke-width="2" rx="3"/>`;
  g += `<rect x="${ox + wl}" y="${oy + wl}" width="${w - 2 * wl}" height="${h - 2 * wl}" fill="#faf8f3" stroke="#888"/>`;
  g += `<rect x="${ox + wl}" y="${oy + h - BEAM_X * s - 3}" width="${w - 2 * wl}" height="6" fill="#555"/>`;
  g += `<text x="${cx}" y="${oy + h - BEAM_X * s - 7}" text-anchor="middle" font-size="9" fill="#555">ID beam</text>`;
  for (const [x, y, dx, dy, label] of walls) {
    // inside: from within the ring toward the wall; outside: from beyond the wall toward it
    const gapIn = wl + 4, gapOut = 6, len = inside ? (dx ? w / 2 - gapIn - 8 : 26) : 30;
    const [x1, y1, x2, y2] = inside
      ? [x - dx * (gapIn + len), y - dy * (gapIn + len), x - dx * gapIn, y - dy * gapIn]
      : [x + dx * (gapOut + len), y + dy * (gapOut + len), x + dx * gapOut, y + dy * gapOut];
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3" marker-end="url(#ah)"/>`;
    g += `<circle cx="${x1}" cy="${y1}" r="4" fill="#fff" stroke="${col}" stroke-width="2"/>`;
    const lx = x + dx * 46, ly = y + dy * 46;
    const anchor = dx < 0 ? "end" : dx > 0 ? "start" : "middle";
    g += `<text x="${lx}" y="${ly + (dy > 0 ? 8 : dy < 0 ? 0 : 4)}" text-anchor="${anchor}" font-size="11" font-weight="600">${label}</text>`;
  }
  g += `<text x="${cx}" y="${oy + h + 72}" text-anchor="middle" font-size="11" fill="#666">you hold this end</text>`;
  return `<svg width="${w + ox + 170}" height="${h + oy + 82}">${g}</svg>`;
}
function wallB(edge, list, L, inside) {
  const v = B_VIEW[edge], s = 5, wallLen = edge === "top" || edge === "bottom" ? L * U : W;
  const reverse = inside ? v.reverse : !v.reverse;
  const [leftLabel, rightLabel] = inside ? [v.leftLabel, v.rightLabel] : [v.rightLabel, v.leftLabel];
  const pad = 70, w = wallLen * s, h = T * s;
  let g = `<rect x="${pad}" y="10" width="${w}" height="${h}" fill="#ece8df" stroke="#555" stroke-width="1.5" rx="3"/>`;
  g += `<line x1="${pad}" y1="${10 + h / 2}" x2="${pad + w}" y2="${10 + h / 2}" stroke="#ccc" stroke-dasharray="3 3"/>`;
  g += `<text x="${pad - 8}" y="${10 + h / 4 + 4}" text-anchor="end" font-size="11" fill="#666">up</text><text x="${pad - 8}" y="${10 + (3 * h) / 4 + 4}" text-anchor="end" font-size="11" fill="#666">down</text>`;
  for (const p of list) {
    const along = reverse ? wallLen - p.mm : p.mm, cx = pad + along * s;
    [[p.up, 10 + h / 4], [p.down, 10 + (3 * h) / 4]].forEach(([pole, cy]) => {
      if (pole === "-") { g += `<circle cx="${cx}" cy="${cy}" r="${p.filled ? 9 : 4}" fill="none" stroke="#c4c4c4" stroke-dasharray="${p.filled ? "3 2" : "0"}"/>`; return; }
      const [big, small, word] = inside ? [OPP[pole], pole, "out"] : [pole, OPP[pole], "in"];
      g += `<circle cx="${cx}" cy="${cy}" r="10" fill="${COL[big]}"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${big}</text>`;
      g += `<text x="${cx + 12}" y="${cy - 5}" font-size="9" font-weight="700" fill="${COL[small]}">${word} ${small}</text>`;
    });
    if (p.filled) g += `<text x="${cx}" y="${10 + h + 14}" text-anchor="middle" font-size="10" fill="#666">${p.text}</text>`;
  }
  const measure = edge === "top" || edge === "bottom" ? "U from the left end" : "U from the top edge";
  return `<div class="B-wall"><b>${v.name}</b> <span class="mute">· ${EDGE_HINT[edge]} · positions in ${measure}</span>
    <div><svg width="${pad + w + 80}" height="${h + 46}">${g}
    <text x="${pad}" y="${h + 42}" font-size="10" fill="#999">← ${leftLabel}</text>
    <text x="${pad + w}" y="${h + 42}" text-anchor="end" font-size="10" fill="#999">${rightLabel} →</text></svg></div></div>`;
}

// ---------- C: a list of pockets, round the ring ----------
function variantC(r) {
  const bits = state.bits.map((b, i) => `<div class="C-bit"><button class="${b ? "one" : ""}" data-bit="${i}">${b ? "/" : ""}</button>bit ${i + 1}${i === 0 ? "<br>top-edge end" : i === 4 ? "<br>bottom-edge end" : "<br>&nbsp;"}</div>`).join("");
  let body = r.status === "ok" ? `<div class="C-card">${title(r)}</div>` : problem(r);
  if (r.status === "ok") {
    // round the ring as you hold it: the near end, up the top edge, the far end, back down the bottom edge
    const order = [["left", false], ["top", false], ["right", false], ["bottom", true]];
    let rows = "";
    for (const [edge, rev] of order) {
      const list = rev ? [...r.walls[edge]].reverse() : r.walls[edge];
      const filled = list.filter((p) => p.filled);
      rows += `<tr class="wallhead"><td colspan="5">${edge[0].toUpperCase() + edge.slice(1)} ${edge === "left" || edge === "right" ? "end" : "edge"} <span class="mute" style="font-weight:400">· ${EDGE_HINT[edge]} · ${filled.length ? `${filled.length} pocket${filled.length > 1 ? "s" : ""}` : "no pockets: solid wall"}</span></td></tr>`;
      for (const p of list) {
        if (!p.filled && !state.showEmpty) continue;
        const where = edge === "top" || edge === "bottom" ? `${p.text} U from the left end <span class="mute">(${p.mm} mm)</span>` : `${p.text} U from the top edge <span class="mute">(${p.mm} mm)</span>`;
        rows += `<tr class="${p.filled ? "" : "emptyrow"}"><td>${where}</td><td>${layerC(p.up)}</td><td>${layerC(p.down)}</td><td>${p.filled ? sectionC(p) : "solid wall"}</td><td class="mute">${p.filled ? `<code>${p.up}/${p.down}</code>` : ""}</td></tr>`;
      }
    }
    body += `<label><input type="checkbox" id="showEmpty" ${state.showEmpty ? "checked" : ""}> show empty positions</label>
      <table class="C" style="margin-top:8px"><tr><th>Where</th><th>Up layer (front)</th><th>Down layer (back)</th><th>Through the wall</th><th>pocket</th></tr>${rows}</table>`;
  }
  return `<h1>Look up a frame</h1>
    <div style="display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin:10px 0">
      <div><div class="mute" style="margin-bottom:6px">ID beam marks, back down, left end toward you</div><div class="C-bits">${bits}</div></div>
      <label>Length<br><input id="len" type="number" value="${Number.isInteger(r.L) ? r.L : ""}" style="width:70px;padding:8px;font-size:18px"> U</label>
      <div class="mute" style="font-size:18px">ID <code>${r.bits}</code> = ${r.id}</div>
    </div>${body}`;
}
function layerC(pole) {
  if (pole === "-") return `<span class="pill E">empty</span>`;
  return `out <span class="pill ${pole}">${pole}</span> &nbsp; in <span class="pill ${OPP[pole]}">${OPP[pole]}</span>`;
}
function sectionC(p) {
  // a cut through the wall: outside on the left, inside on the right, up layer on top
  const cell = (pole, y) => pole === "-" ? `<rect x="22" y="${y}" width="22" height="13" fill="none" stroke="#ccc" stroke-dasharray="2 2"/>` :
    `<rect x="22" y="${y}" width="11" height="13" fill="${COL[pole]}"/><rect x="33" y="${y}" width="11" height="13" fill="${COL[OPP[pole]]}"/>` +
    `<text x="27.5" y="${y + 10}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${pole}</text><text x="38.5" y="${y + 10}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${OPP[pole]}</text>`;
  return `<svg width="165" height="54" viewBox="0 0 110 36"><rect x="18" y="1" width="30" height="34" fill="#ece8df" stroke="#888"/>${cell(p.up, 3)}${cell(p.down, 20)}
    <text x="14" y="21" text-anchor="end" font-size="9" fill="#666">out</text><text x="52" y="21" font-size="9" fill="#666">in → ring</text></svg>`;
}

// ---------- wiring ----------
function render() {
  const r = lookup();
  const app = document.getElementById("app");
  app.innerHTML = { A: variantA, B: variantB, C: variantC }[state.variant](r);
  app.querySelectorAll("[data-bit]").forEach((el) => el.addEventListener("click", () => { const i = +el.dataset.bit; state.bits[i] ^= 1; render(); }));
  app.querySelectorAll("[data-len]").forEach((el) => el.addEventListener("click", () => { state.length = (Number.isInteger(state.length) ? state.length : 2) + +el.dataset.len; render(); }));
  app.querySelectorAll("[data-id]").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); state.bits = bitsOf(+el.dataset.id).split("").map(Number); render(); }));
  const len = app.querySelector("#len");
  if (len) len.addEventListener("change", () => { state.length = len.value === "" ? NaN : Number(len.value); render(); });
  const sel = app.querySelector("#lensel");
  if (sel) sel.addEventListener("change", () => { state.length = Number(sel.value); render(); });
  app.querySelectorAll("[data-view]").forEach((el) => el.addEventListener("click", () => { state.view = el.dataset.view; sync(); render(); }));
  const se = app.querySelector("#showEmpty");
  if (se) se.addEventListener("change", () => { state.showEmpty = se.checked; render(); });
  const runs = Object.keys(D.runs).map((k) => `<button class="${k === state.run ? "on" : ""}" data-run="${k}">${k === "full" ? "full search" : k}</button>`).join("");
  const sw = document.getElementById("switcher");
  sw.innerHTML = `<span style="opacity:.6">PROTOTYPE</span><button data-step="-1">←</button><span class="lbl">${state.variant} (${VARIANTS[state.variant]})</span><button data-step="1">→</button><span class="sep"></span>run ${runs}`;
  sw.querySelectorAll("[data-step]").forEach((el) => el.addEventListener("click", () => step(+el.dataset.step)));
  sw.querySelectorAll("[data-run]").forEach((el) => el.addEventListener("click", () => { state.run = el.dataset.run; sync(); render(); }));
  console.log("state", JSON.parse(JSON.stringify({ ...state, result: { ...r, run: undefined } })));
}
function sync() {
  const q = new URLSearchParams(location.search);
  q.set("variant", state.variant); q.set("run", state.run); q.set("view", state.view);
  history.replaceState(null, "", "?" + q);
}
function step(d) { state.variant = KEYS[(KEYS.indexOf(state.variant) + d + KEYS.length) % KEYS.length]; sync(); render(); }
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
sync();
render();
</script>
</body>
</html>
