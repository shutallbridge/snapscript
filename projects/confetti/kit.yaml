# The kit: the cards made for this project, one line per card in card notation,
# with how many sheets of it. It is the Stage 1 bases' 57 sheets (#121, #158),
# and the 24 more that demo programs 2 and 3 need (#109), fixed and responsive,
# none re-sheeted between them: 81 sheets.
#
# A flip pair is its two sides, front first: "[num{}] / [str{}]". Handwriting
# goes in empty braces, and every card is at its shortest length, so the
# handwritten cards are all 4U. pnpm print looks each side's marker up in
# language/markers.yaml or snapscript.lock.

# call 2U ×17 (the circle is for "Try these", on the base meant for list)
"[call(p5.fill)]": 3
"[call(p5.rect)]": 3
"[call(random)]": 6
"[call(p5.circle)]": 1
"[call(list)]": 1
"[call(p5.noise)]": 1
"[call(range)]": 2

# call 3U ×2, call 4U ×1
"[call(p5.background)]": 1
"[call(p5.noStroke)]": 1
"[call(p5.createCanvas)]": 1

# define 4U ×1, define 3U ×1
"[define(setup)]": 1
"[define(draw)]": 1

# literal 4U ×17
"[num{}] / [str{}]": 17

# simple_head 4U ×6
"[set{}to]": 6

# get 4U ×9
"[get{}]": 9

# get 2U ×2, 3U ×3, 4U ×1: snapscript-p5's
"[get(p5.width)]": 1
"[get(p5.height)]": 1
"[get(p5.frameCount)]": 2
"[get(p5.windowWidth)]": 1
"[get(p5.windowHeight)]": 1

# color 4U ×6
"[color(mediumblue)] / [color(deepskyblue)]": 1
"[color(gold)] / [color(yellow)]": 1
"[color(hotpink)] / [color(tomato)]": 1
"[color(aquamarine)] / [color(limegreen)]": 1
"[color(black)] / [color(red)]": 1
"[color(white)] / [color(orange)]": 1

# operator 2U ×7
"[*] / [/]": 5
"[+] / [-]": 2

# block_head 4U ×2, block_head 2U ×3, dedent 2U ×3
"[for{}in]": 2
"[repeat]": 3
"[dedent]": 3
