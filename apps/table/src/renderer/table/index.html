<!doctype html>
<!-- The table view: laid over the whole window, above the sketch view. The canvas space is left clear. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: none; }
      canvas { position: fixed; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <canvas id="table"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
