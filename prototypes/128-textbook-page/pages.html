<!doctype html>
<!-- PROTOTYPE (#128), throwaway. Textbook pages on A4, each with a real tagStandard41h12 page marker.
     No card pictures: a page points at its virtual cards on the table instead.
     Serve the folder (python3 -m http.server) and print at 100%, margins "none", background graphics on. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE #128: textbook pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Geist:wght@400;600&family=Kalam:wght@400&display=swap" rel="stylesheet">
<style>
  @page { size: 210mm 297mm; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ccc; font: 11.5pt/1.45 Geist, system-ui, sans-serif; color: #18181b; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { position: relative; width: 210mm; height: 297mm; background: #fff; margin: 10mm auto; overflow: hidden; break-after: page; }
  .marker { position: absolute; }
  .body { position: absolute; left: 20mm; right: 20mm; top: 20mm; bottom: 26mm; }
  .kicker { font: 8pt Geist Mono, monospace; color: #71717a; letter-spacing: .02em; }
  h1 { font-size: 24pt; line-height: 1.1; margin: 8mm 0 10mm; font-weight: 600; }
  h2 { font-size: 12pt; margin: 6mm 0 2mm; font-weight: 600; }
  p { margin: 0 0 2.5mm; }
  code { font: 10.5pt Geist Mono, monospace; background: #f4f4f5; padding: 0 1mm; }
  ul { margin: 0; padding-left: 5mm; } li { margin-bottom: 1.5mm; }
  .minis { white-space: nowrap; } .mini { display: inline-block; vertical-align: -0.5em; margin: 0 .4mm; }
  .callout { background: #fbeadf; border-radius: 2mm; padding: 4mm 5mm; margin: 2mm 0 4mm; font-size: 12pt; }
  .see { border-left: 1.2mm solid #a1a1aa; padding: 1mm 0 1mm 3mm; margin: 4mm 0; }
  .foot { position: absolute; left: 20mm; bottom: 10mm; height: 13mm; display: flex; align-items: flex-end; }  /* level with the marker's bottom edge */
  .page:last-child { break-after: auto; }
  @media print { body { background: none; } .page { margin: 0; } }
</style>
</head>
<body>
<div id="out"></div>
<script>window.LIBRARY = true;</script>
<script src="sheets.js"></script>
<script>probe.style.top = "0";  // sheets.js's off-screen text probe, else it adds a blank last page</script>
<script src="tags.js"></script>
<script src="minis.js"></script>
<script>
const EM_PER_MM = 72 / 25.4 / 11.5;  // the body text is 11.5 pt

function tagSvg(id, size) {  // the real marker, one path, no seams
  const c = size / 9; let d = '';
  TAGS[id].forEach((row, y) => [...row].forEach((b, x) => { if (b === '1') d += `M${x * c} ${y * c}h${c}v${c}h${-c}z`; }));
  return `<svg xmlns="${NS}" viewBox="0 0 ${size} ${size}" style="width:${size}mm;height:${size}mm;display:block" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
}

async function main() {
  const book = await (await fetch('pages.json', { cache: 'no-store' })).json();
  const byKey = Object.fromEntries(book.pages.map(p => [p.key, p]));
  let html = '';
  for (const page of book.pages) {
    const c = page.same_as ? { ...byKey[page.same_as], ...page } : page;
    const markers = Object.entries(page.markers).map(([id, [x, y]]) =>
      `<div class="marker" style="left:${x}mm;top:${y}mm">${tagSvg(id, book.marker)}</div>`).join('');
    html += `<section class="page">${markers}<div class="body">
      <div class="kicker">SNAPSCRIPT · GETTING STARTED WITH P5</div>
      <h1>${c.name.replace(/ \(.*\)$/, '')}</h1>
      ${minis(c.intro, EM_PER_MM)}
      <h2>Lay the cards like this</h2>
      <div class="callout">✴️ See the virtual cards on the table</div>
      <div class="see"><b>You should see:</b> ${c.see}</div>
      <h2>Try these</h2>
      <ul>${c.try.map(t => `<li>${minis(t, EM_PER_MM)}</li>`).join('')}</ul>
      <h2>${c.key === '0' ? 'What just happened' : 'Before you turn the page'}</h2>
      <p>${minis(c.happened, EM_PER_MM)}</p>
    </div>
    <div class="foot kicker">PAGE ${page.key}</div>
    </section>`;
  }
  $('out').innerHTML = html;
}
Promise.all([document.fonts.load('500 12px "Geist Mono"'), document.fonts.load('12px Geist'), document.fonts.load('12px Kalam')]).then(main, main);
</script>
</body>
</html>
