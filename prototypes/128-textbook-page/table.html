<!doctype html>
<!-- PROTOTYPE (#128), throwaway. What the projector shows: the table split into a coding space (left) and a
     canvas space (right), the current page's virtual cards in the coding space, and every page in view cut out
     of the light. Reads state.json (from vision.py) and control.json (written over SSH; see README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE #128: table</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { position: fixed; left: 0; top: 0; }
  #sketch { position: fixed; }
  #sketch canvas { position: static; }
</style>
<script src="p5.min.js"></script>
</head>
<body>
<canvas id="base"></canvas>
<div id="sketch"></div>
<canvas id="over"></canvas>
<script>window.LIBRARY = true;</script>
<script src="sheets.js"></script>
<script src="tags.js"></script>
<script>
let book = null, state = { mode: 'run', pages: [] }, view = { margin: 10, outline: false, lit: false, cards: true, hud: true };
let pxPerMm = +localStorage.pxPerMm || 0;  // learnt from a page lying on the table; kept across reloads
const base = document.getElementById('base'), over = document.getElementById('over');
const VW = () => innerWidth, VH = () => innerHeight;  // (sheets.js has its own H: the card height, 30 mm)
const toPx = ([x, y]) => [x * VH(), y * VH()];  // projector space (units of height) -> px

function size() { for (const c of [base, over]) { c.width = VW(); c.height = VH(); } }
addEventListener('resize', size); size();

// ---- the canvas space: what the current page's program would draw (stand-in for the running sketch) ----
const scene = () => (state.current || '').startsWith('1') ? 'rect' : state.current === '0' ? 'canvas' : 'none';
new p5(p => {
  p.setup = () => { p.createCanvas(10, 10).parent('sketch'); };
  p.draw = () => {
    const s = Math.min(VW() / 2 - 80, VH() - 120);
    if (p.width !== Math.round(s)) p.resizeCanvas(Math.round(s), Math.round(s));
    const el = document.getElementById('sketch');
    el.style.left = (VW() * 0.75 - s / 2) + 'px'; el.style.top = (VH() / 2 - s / 2) + 'px';
    p.scale(s / 500);
    if (scene() === 'none') { p.background(18); return; }
    p.background('mediumblue');
    if (scene() === 'rect') { p.fill(255); p.stroke(0); p.strokeWeight(1); p.rect(300, 300, 60, 40); }
  };
});

// ---- the coding space: the current page's virtual cards, at true size ----
function program(key) {
  const page = book.pages.find(q => q.key === key);
  return page && (page.program || book.pages.find(q => q.key === page.same_as).program);
}
function drawCards(g) {
  const prog = state.current && program(state.current);
  if (!prog || !view.cards) return;
  const k = pxPerMm || VH() / 900, S = settings();
  let y = 40;
  for (const line of prog.split('\n')) {
    let x = 40;
    for (const side of parseLine(line)) {
      const L = minLength(side, S), w = L * U;
      g.save(); g.translate(x * k, y * k);
      g.strokeStyle = side.c.stripe; g.lineWidth = 0.8 * k; g.setLineDash([]);
      g.strokeRect(0, 0, w * k, H * k);
      g.fillStyle = side.c.stripe; g.fillRect(MZ * k, 0, STRIPE * k, H * k);
      g.fillStyle = '#e4e4e7'; g.font = `500 ${fsz(S) * k}px "Geist Mono"`; g.textBaseline = 'middle';
      const label = side.k === 'hw' ? side.word : side.label || '';
      g.fillText(label, labelX(S) * k, H / 2 * k);
      if (side.k === 'hw') {
        const x0 = (labelX(S) + measure(side.word, fsz(S)) + S.gap) * k;
        g.setLineDash([2 * k, 2 * k]); g.strokeStyle = '#71717a';
        g.strokeRect(x0, S.wbPad * k, w * k - S.margin * k - x0, (H - 2 * S.wbPad) * k);
        g.fillStyle = '#a1a1aa'; g.font = `500 ${17 * k}px Caveat`;
        g.fillText(side.sample, x0 + 2.5 * k, H / 2 * k);
      }
      g.restore();
      x += w + 2;
    }
    y += H + 4;
  }
}

function drawBase() {
  const g = base.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, VW(), VH());
  if (state.mode === 'calibrate') return;
  g.fillStyle = view.lit ? '#fff' : '#000'; g.fillRect(0, 0, VW(), VH());
  if (view.lit) return;
  g.strokeStyle = '#3f3f46'; g.lineWidth = 2; g.beginPath(); g.moveTo(VW() / 2, 20); g.lineTo(VW() / 2, VH() - 20); g.stroke();
  g.fillStyle = '#52525b'; g.font = '500 18px "Geist Mono"';
  g.fillText('coding space', 20, VH() - 20); g.fillText('canvas space', VW() / 2 + 20, VH() - 20);
  drawCards(g);
}

// ---- on top: every page in view cut out of the light (grown by view.margin mm), or the calibration tags ----
function drawOver() {
  const g = over.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, VW(), VH());
  document.getElementById('sketch').style.visibility = state.mode === 'calibrate' || view.lit ? 'hidden' : 'visible';
  if (state.mode === 'calibrate') return drawCalib(g);
  for (const page of state.pages) {
    const pts = page.corners.map(toPx);
    const edge = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]);
    pxPerMm = edge / book.paper[0]; localStorage.pxPerMm = pxPerMm;
    g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    g.fillStyle = '#000'; g.fill();
    if (view.margin > 0) { g.strokeStyle = '#000'; g.lineJoin = 'miter'; g.lineWidth = 2 * view.margin * pxPerMm; g.stroke(); }
    if (view.outline) {  // the predicted paper edge itself, to compare with the real one
      g.strokeStyle = '#f43f5e'; g.lineWidth = 2; g.stroke();
    }
  }
  if (view.hud) {
    const cur = state.current && book.pages.find(q => q.key === state.current);
    g.fillStyle = view.lit ? '#000' : '#a1a1aa'; g.font = '500 18px "Geist Mono"';
    g.fillText(`page: ${cur ? cur.name : 'none'} · in view: ${state.pages.map(q => q.key).join(', ') || '-'} · rule ${state.rule || '?'}` +
      ` · ${state.calibrated ? '' : 'NOT CALIBRATED · '}search ${state.search_s ?? '?'} s` +
      (state.unknown_ids && state.unknown_ids.length ? ` · unknown ${state.unknown_ids}` : ''), 20, 32);
  }
}

function drawCalib(g) {
  const c = book.calib, aspect = VW() / VH();
  g.fillStyle = '#000'; g.fillRect(0, 0, VW(), VH());
  c.ids.forEach((id, i) => {
    const col = i % c.cols, row = (i / c.cols) | 0, s = c.size * VH(), cell = s / 9;
    const cx = (col + 0.5) / c.cols * aspect * VH(), cy = (row + 0.5) / c.rows * VH();
    g.fillStyle = '#fff'; g.fillRect(cx - s * 0.75, cy - s * 0.75, s * 1.5, s * 1.5);
    g.fillStyle = '#000';
    TAGS[id].forEach((r, y) => [...r].forEach((b, x) => { if (b === '1') g.fillRect(cx - s / 2 + x * cell, cy - s / 2 + y * cell, cell + 0.5, cell + 0.5); }));
  });
}

// ---- polling ----
async function poll(file, apply, ms) {
  try { apply(await (await fetch(file + '?' + Date.now(), { cache: 'no-store' })).json()); } catch (e) { /* not there yet */ }
  setTimeout(() => poll(file, apply, ms), ms);
}
(async () => {
  book = await (await fetch('pages.json', { cache: 'no-store' })).json();
  let rev = null;
  poll('state.json', s => { state = s; }, 150);
  poll('control.json', c => { if (rev !== null && c.rev !== rev) location.reload(); rev = c.rev; Object.assign(view, c.view || {}); }, 500);
  const frame = () => { drawBase(); drawOver(); requestAnimationFrame(frame); };
  document.fonts.ready.then(frame);
})();
</script>
</body>
</html>
