<!doctype html>
<!--
  PROTOTYPE (#101), throwaway. Card sheets in Shu's Figma row 3 style: a white marker
  zone, a Tailwind v4 300 tint with a thin stripe, Geist Mono. Text and stripe colours
  come from one rule applied to the background, so color cards follow it too.
  Everything is drawn in mm: print at 100% for true size. Markers are stand-ins.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE #101 — card sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 24px 24px 90px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 6px; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: #555; }
  .note { color: #666; max-width: 75em; margin: 0 0 10px; }
  .controls { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 12px 0 8px; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font: 11px/1.3 ui-monospace, Menlo, monospace; color: #666; margin-top: 2px; }
  figcaption b { color: #222; }
  .table { background: #e4e4e4; border-radius: 6px; padding: 12px; }
  .program { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .program pre { font: 11px/1.45 ui-monospace, Menlo, monospace; background: #f5f5f4; padding: 10px 12px; border-radius: 6px; margin: 0; }
  table { border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  th, td { border: 1px solid #ddd; padding: 3px 8px; text-align: left; vertical-align: middle; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 26px; height: 16px; border-radius: 3px; vertical-align: middle; }
  .chip { display: inline-block; font: 12px/1 ui-monospace, Menlo, monospace; padding: 4px 8px; border-radius: 4px; margin: 0 4px 4px 0; }
  #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
         background: #111; color: #fff; padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 18px rgba(0,0,0,.3); font-size: 13px; z-index: 9; }
  #bar button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
  #bar span { min-width: 26em; text-align: center; }
  @media print {
    #bar, .controls, .screen-only { display: none; }
    body { margin: 10mm; }
    @page { size: a4; margin: 0; }
    .print-break { break-before: page; }
  }
</style>
</head>
<body>
<h1>PROTOTYPE #101 — card sheets (row 3)</h1>
<p class="note" id="about"></p>
<div class="controls">
  <label>Label <input id="pt" type="range" min="22" max="36" step="1" value="26"> <b id="ptv"></b> pt</label>
  <label>Padding <input id="margin" type="range" min="2" max="6" step="0.5" value="3"> <b id="marginv"></b> mm</label>
  <label>Gap <input id="gap" type="range" min="2" max="6" step="0.5" value="3"> <b id="gapv"></b> mm</label>
  <label>Whiteboard padding (top, bottom) <input id="wbpad" type="range" min="2" max="7" step="0.5" value="3"> <b id="wbpadv"></b> mm</label>
  <label>Shortest whiteboard <select id="wbmin"><option value="45">1.5U (45 mm)</option><option value="60" selected>2U (60 mm)</option></select></label>
  <label>Color cards <select id="colorlen"><option value="3">3U</option><option value="4" selected>4U</option></select></label>
  <label>Dedent icon <input id="iconsize" type="range" min="6" max="18" step="1" value="12"> <b id="iconsizev"></b> mm,
    stroke <input id="iconstroke" type="range" min="0.5" max="2.5" step="0.25" value="1.5"> <b id="iconstrokev"></b> mm</label>
  <label><input id="hw" type="checkbox" checked> sample handwriting</label>
</div>
<div id="out"></div>

<script src="sheets.js"></script>

</body>
</html>
