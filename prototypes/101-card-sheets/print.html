<!doctype html>
<!-- PROTOTYPE (#101), throwaway. A few card sheets to print at 100%, cut out, fold and try on a base. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE #101 — sheets to print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  @page { size: a4; margin: 10mm; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 10mm; color: #222; }
  .controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; padding: 10px; background: #f4f4f5; border-radius: 6px; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  .settings { font: 9px/1.3 ui-monospace, Menlo, monospace; color: #555; margin: 0 0 3mm; }
  .sheets { display: flex; flex-wrap: wrap; gap: 4mm 5mm; align-items: flex-start; width: 190mm; }
  figure { margin: 0; break-inside: avoid; }
  figcaption { font: 8px/1.2 ui-monospace, Menlo, monospace; color: #888; margin-top: 1mm; }
  @media print { .controls { display: none; } body { margin: 0; } }
</style>
</head>
<body>
<div class="controls">
  <b>Print at 100% (no "fit to page").</b>
  <label>Label <input id="pt" type="range" min="22" max="32" step="1" value="26"> <b id="ptv"></b> pt</label>
  <label>Padding <input id="margin" type="range" min="2" max="6" step="0.5" value="3"> <b id="marginv"></b> mm</label>
  <label>Gap <input id="gap" type="range" min="2" max="6" step="0.5" value="3"> <b id="gapv"></b> mm</label>
  <label>Whiteboard padding <input id="wbpad" type="range" min="2" max="7" step="0.5" value="4"> <b id="wbpadv"></b> mm</label>
  <label>Dedent icon <input id="iconsize" type="range" min="6" max="18" step="1" value="12"> <b id="iconsizev"></b> mm,
    stroke <input id="iconstroke" type="range" min="0.5" max="2.5" step="0.25" value="1.25"> <b id="iconstrokev"></b> mm</label>
</div>
<div id="out"></div>
<script>window.PRINT = true;</script>
<script src="sheets.js"></script>
</body>
</html>
