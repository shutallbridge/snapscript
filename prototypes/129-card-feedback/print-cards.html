<!doctype html>
<!-- PROTOTYPE (#129), throwaway. Paper test cards (no base) with real tagStandard41h12 markers, from cards.json.
     Print at 100% on A4, cut on the grey line. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE #129 — paper test cards</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  @page { size: a4; margin: 10mm; }
  body { font: 9px/1.3 ui-monospace, Menlo, monospace; margin: 0; color: #555; }
  .cards { display: flex; flex-wrap: wrap; gap: 3mm 3mm; width: 190mm; align-items: flex-start; }
  figure { margin: 0; break-inside: avoid; }
  figcaption { font-size: 7px; color: #999; margin-top: .5mm; }
</style>
</head>
<body>
<div id="out"></div>
<script>window.LIBRARY = true;</script>
<script src="sheets.js"></script>
<script src="tags.js"></script>
<script>
const S = { pt: 26, margin: 3, gap: 3, wbPad: 3, wbMin: 60, colorLen: 4, iconSize: 12, iconStroke: 1.5 };
let cardId = null;
marker = (x, y) => {  // sheets.js draws a stand-in; draw the card's real marker instead
  const c = MK / 9; let d = '';
  TAGS[cardId].forEach((row, j) => [...row].forEach((b, i) => { if (b === '1') d += `M${x + i * c} ${y + j * c}h${c}v${c}h${-c}z`; }));
  return `<path d="${d}" fill="#000" shape-rendering="crispEdges"/>`;
};
document.fonts.ready.then(async () => {
  const { cards } = await (await fetch('cards.json')).json();
  $('out').innerHTML = `<p>Paper test cards for #129. Print at 100%, cut on the grey line. Check: the bar is 50 mm.</p>` +
    `<svg xmlns="${NS}" viewBox="0 0 52 4" style="display:block;width:52mm;height:4mm;margin-bottom:3mm"><path d="M1 2 H51 M1 0 V4 M51 0 V4" stroke="#000" stroke-width=".3"/></svg>` +
    `<div class="cards">` + Object.entries(cards).map(([id, text]) => {
      cardId = id;
      const side = parseCard(text);
      if (side.sample === '…') side.sample = '';
      const L = minLength(side, S), w = L * U;
      return `<figure>${svgMm(face(side, L, S, true) + `<rect width="${w}" height="${H}" fill="none" stroke="#aaa" stroke-width=".2"/>`, -0.2, -0.2, w + 0.4, H + 0.4)}` +
        `<figcaption>${id} · ${esc(text)} · ${L}U</figcaption></figure>`;
    }).join('') + `</div>`;
  document.body.dataset.ready = 1;
});
</script>
</body>
</html>
