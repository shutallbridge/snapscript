<!doctype html>
<!-- PROTOTYPE (#114), throwaway. What the projector shows: the table as two windows, the coding space (left) and
     the canvas space (right), resized from a hidden settings menu (press , on the handheld keyboard) or with ←→.
     The sketch is drawn at a fixed size (1U = 50 px). Each of the four corners can be given an action; a card put in
     one triggers it at once (help, bottom-left: the card's doc comment). Every textbook page in view is cut
     out of the light with a dim area around it. Reads state.json (from vision.py) and control.json (over SSH; see README.md).
     Works without vision.py too (on a laptop): pages and card markers are then just absent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE #114: table layout</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { position: fixed; left: 0; top: 0; }
  #clip { position: fixed; overflow: hidden; }
  #sketch { position: absolute; transform-origin: 0 0; }
  #sketch canvas { position: static; display: block; }
  #menu { position: fixed; display: none; background: #18181b; color: #e4e4e7; font: 500 18px "Geist Mono", monospace;
    border: 2px solid #52525b; padding: 16px 18px 12px; min-width: 460px; }
  #menu .title { font-size: 22px; color: #fff; padding: 0 8px 10px; }
  #menu .crumb { color: #71717a; }
  #menu .row { display: flex; justify-content: space-between; gap: 30px; padding: 4px 8px; color: #d4d4d8; }
  #menu .reset { margin-top: 10px; border-top: 1px solid #3f3f46; padding-top: 10px; color: #a1a1aa; }
  #menu .reset.on { color: #fff; }
  #menu .row.on { background: #3f3f46; color: #fff; }
  #menu .v::before { content: '‹ '; color: #71717a; } #menu .v::after { content: ' ›'; color: #71717a; }
  #menu .go::after { content: '›'; color: #71717a; }
  #menu .keys { color: #71717a; font-size: 14px; padding: 12px 8px 0; border-top: 1px solid #3f3f46; margin-top: 10px; }
  #toast { position: fixed; color: #a1a1aa; font: 500 18px "Geist Mono", monospace; display: none; }
</style>
<script src="p5.min.js"></script>
</head>
<body>
<canvas id="base"></canvas>
<div id="clip"><div id="sketch"></div></div>
<canvas id="over"></canvas>
<div id="menu"></div>
<div id="toast"></div>
<script>window.LIBRARY = true;</script>
<script src="sheets.js"></script>
<script src="tags.js"></script>
<script>
// ======================= settings (the hidden menu) =======================
// Units: the app works in its own px, with 1U (30 mm) = 50 px, whatever the projector's real resolution. The sketch,
// table text and sizes are all in these px; real cards are drawn at true size in mm.
const PX_PER_U = 50;
const CORNER_U = 3.5;  // a corner's dotted quarter circle: its radius in U (fixed, not a setting)
const CORNERS = ['tl', 'tr', 'bl', 'br'], CORNER_NAME = { tl: 'top-left', tr: 'top-right', bl: 'bottom-left', br: 'bottom-right' };
const cap = t => t[0].toUpperCase() + t.slice(1);
// The menu is for whoever runs the table (a facilitator), in two levels: a section, then its settings.
const SECTIONS = [  // name, [key, label, choices, unit]
  ['Windows', [
    ['split', 'Coding space width', [30, 35, 40, 45, 50, 55, 60, 65, 70], '%'],
    ['full', 'Canvas full screen', [false, true]],
    ['centre', 'Centre the sketch', [true, false]]]],
  ['Corners', [
    ...CORNERS.map(c => ['corner_' + c, cap(CORNER_NAME[c]), ['none', 'help']])]],
  ['Textbook pages', [
    ['margin', 'Margin', [0, 2, 3, 5, 10, 15], ' mm'],
    ['halo', 'Dim area', [0, 2, 5, 10, 20, 40, 60, 100], ' mm'],
    ['radius', 'Corner radius', [0, 2, 3, 5, 10], ' mm']]],
  ['Appearance', [
    ['textPx', 'Text size', [12, 14, 16, 18, 20, 24, 28, 32], ' px'],
    ['bg', 'Coding space brightness', [0, 6, 12, 20, 32, 48]]]],
  ['Rig', [
    ['tableMm', 'Work area depth', [700, 750, 780, 792, 800, 850, 900], ' mm']]],
  ['Debug', [
    ['marks', 'Show marker reads', [true, false]],
    ['outline', 'Page outline (red)', [true, false]],
    ['hud', 'Status line', [true, false]],
    ['fake', 'Pretend a card is in a corner', ['off', ...CORNERS]],
    ['program', 'Mock program', [true, false]],
    ['test', 'Highlight test', [false, true]],
    ['cardU', 'Card length when unknown', [2, 3, 4, 5, 6], 'U']]],
];
const OPTS = SECTIONS.flatMap(([, opts]) => opts);
const DEFAULTS = { split: 50, cardU: 4, corner_tl: 'none', corner_tr: 'none', corner_bl: 'help', corner_br: 'none', fake: 'off',
  full: false, centre: true, textPx: 16, bg: 12, margin: 3, halo: 2, radius: 0, program: true, test: false, marks: true, outline: true, hud: true, tableMm: 792 };
let cfg = { ...DEFAULTS, ...JSON.parse(localStorage.cfg114d || '{}') };
const save = () => { localStorage.cfg114d = JSON.stringify(cfg); };

// menu: null (closed) | {section: null, row} (the list of sections) | {section: [name, opts], row} (one section's settings)
let menu = null;
const menuEl = document.getElementById('menu'), toast = document.getElementById('toast');
const valueText = ([, , ch, unit = ''], v) => v === true ? 'On' : v === false ? 'Off' : typeof v === 'string' ? cap(CORNER_NAME[v] || v) : v + unit;
function showMenu() {
  menuEl.style.display = menu ? 'block' : 'none';
  if (!menu) return;
  const sec = menu.section, row = (html, i, value = '') =>
    `<div class="row${i === menu.row ? ' on' : ''}"><span>${html}</span><span class="${value ? 'v' : 'go'}">${value}</span></div>`;
  menuEl.innerHTML = sec
    ? `<div class="title"><span class="crumb">Settings ›</span> ${sec[0]}</div>` +
      sec[1].map((o, i) => row(o[1], i, valueText(o, cfg[o[0]]))).join('') +
      `<div class="keys">↑↓ Choose · ←→ Change · Esc Back</div>`
    : `<div class="title">Settings</div>` + SECTIONS.map(([name], i) => row(name, i)).join('') +
      `<div class="row reset${menu.row === SECTIONS.length ? ' on' : ''}"><span>${menu.confirm ? 'Press Enter again to reset everything' : 'Reset all settings'}</span></div>` +
      `<div class="keys">↑↓ Choose · Enter Open · Esc Close</div>`;
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = (AW() / 2 - r.width / 2) + 'px'; menuEl.style.top = (VH() / 2 - r.height / 2) + 'px';
}
function step(key, d) {
  const ch = OPTS.find(o => o[0] === key)[2], i = ch.indexOf(cfg[key]);
  cfg[key] = ch[Math.max(0, Math.min(ch.length - 1, (i < 0 ? 0 : i) + d))]; save();
}
let toastT = 0;
function say(msg) { toast.textContent = msg; toast.style.display = 'block'; toast.style.left = '20px'; toast.style.top = (VH() - 60) + 'px'; clearTimeout(toastT); toastT = setTimeout(() => toast.style.display = 'none', 1500); }
addEventListener('keydown', e => {
  if (e.key === ',') { menu = menu ? null : { section: null, row: 0 }; showMenu(); return e.preventDefault(); }
  if (menu) {
    const sec = menu.section, n = sec ? sec[1].length : SECTIONS.length + 1;  // + the reset row
    if (e.key !== 'Enter') menu.confirm = false;
    if (e.key === 'ArrowUp') menu.row = (menu.row + n - 1) % n;
    else if (e.key === 'ArrowDown') menu.row = (menu.row + 1) % n;
    else if (!sec) {  // the list of sections
      if (menu.row === SECTIONS.length) {  // reset all settings: Enter, then Enter again to confirm
        if (e.key === 'Enter' && menu.confirm) { cfg = { ...DEFAULTS }; save(); menu.confirm = false; }
        else if (e.key === 'Enter') menu.confirm = true;
        else if (e.key === 'Escape') menu = null;
      }
      else if (e.key === 'Enter' || e.key === 'ArrowRight') menu = { section: SECTIONS[menu.row], row: 0, from: menu.row };
      else if (e.key === 'Escape') menu = null;
    } else {          // one section's settings
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') step(sec[1][menu.row][0], e.key === 'ArrowLeft' ? -1 : 1);
      else if (e.key === 'Escape' || e.key === 'Backspace') menu = { section: null, row: menu.from };
    }
    showMenu(); return e.preventDefault();
  }
  // menu closed: ←→ resize the two windows
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { step('split', e.key === 'ArrowLeft' ? -1 : 1); say(`coding space ${cfg.split}%`); }
});

// ======================= geometry =======================
let book = null, state = { mode: 'run', pages: [], cards: [] };
const base = document.getElementById('base'), over = document.getElementById('over');
const VW = () => innerWidth, VH = () => innerHeight;
const AW = () => Math.min(VW(), (state.aspect || 1.5) * VH());  // work area: the left part of the image (the 16:9 image spills past the table)
const mm = () => VH() / cfg.tableMm;                              // projector px per mm on the table
const UPX = () => 30 * mm();                                        // projector px per U
const S = () => UPX() / PX_PER_U;                                   // projector px per app px
const toPx = ([x, y]) => [x * VH(), y * VH()];                     // projector space (units of height) -> projector px
function size() { for (const c of [base, over]) { c.width = VW(); c.height = VH(); } }
addEventListener('resize', size); size();
// The sketch's size in app px comes from the program's createCanvas (the current page's, else the mock's).
// The prototype doesn't run cards, so it reads the numbers out of the program's text.
function sketchSize() {
  const m = /\[call\(p5\.createCanvas\)\]\[num\{(\d+)\}\]\[num\{(\d+)\}\]/.exec((state.current && program(state.current)) || MOCK);
  return m ? [+m[1], +m[2]] : [100, 100];  // p5's default canvas
}

// Two windows side by side, coding space on the left, resized by cfg.split. A window decides which markers belong to
// it, so `code` stays the split's coding space even when the canvas window is full screen (cfg.full): full screen only
// changes what is shown, like a browser's full screen, and cards still count by where the coding space would be. The sketch sits centred in the canvas window, or at its top-left.
function layout() {
  const W = AW(), H = VH(), [sw, sh] = sketchSize().map(v => v * S()), codeW = Math.round(W * cfg.split / 100);
  const code = { x: 0, y: 0, w: codeW, h: H }, canvas = cfg.full ? { x: 0, y: 0, w: W, h: H } : { x: codeW, y: 0, w: W - codeW, h: H };
  const sketch = cfg.centre ? { x: canvas.x + (canvas.w - sw) / 2, y: canvas.y + (canvas.h - sh) / 2, w: sw, h: sh }
    : { x: canvas.x, y: canvas.y, w: sw, h: sh };
  const R = CORNER_U * UPX();
  const corners = { tl: [0, 0], tr: [W, 0], bl: [0, H], br: [W, H] };
  return { W, H, code, canvas, sketch, R, corners };
}
const inside = (r, [x, y]) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

// ======================= corners: a card (later a hand) put in a corner triggers it at once =======================
const CORNER_TITLE = { help: 'Card Help' };
// A card's length in U, by marker ID. There's no lockfile yet, so fill in the cards on the table; others use cfg.cardU.
const CARD_LEN = {};
// The card's outline on the table, from its marker: the marker sits in the card's left end (centre MZ/2 in), upright,
// and the card runs along the marker's bottom edge. Returns 4 corners in projector px.
function cardOutline(card) {
  const k = mm(), L = (CARD_LEN[card.id] || cfg.cardU) * U, a = card.a || 0;
  const [x, y] = toPx(card.c), d = [Math.cos(a), Math.sin(a)], n = [-Math.sin(a), Math.cos(a)];
  return [[-MZ / 2, -H / 2], [L - MZ / 2, -H / 2], [L - MZ / 2, H / 2], [-MZ / 2, H / 2]]
    .map(([u, v]) => [x + (u * d[0] + v * n[0]) * k, y + (u * d[1] + v * n[1]) * k]);
}
// A card counts as present while vision has seen it in the last PRESENT_S (vision.py takes ~0.8 s a frame).
const PRESENT_S = 1.0, lastSeen = {};  // corner -> {since, seen, fired}
const cornerState = {};
function updateCorners(L) {
  const now = performance.now() / 1000;
  for (const c of CORNERS) {
    const [cx, cy] = L.corners[c];
    const card = (state.cards || []).find(k => { const [x, y] = toPx(k.c); return Math.hypot(x - cx, y - cy) <= L.R; });
    const here = cfg['corner_' + c] !== 'none' && (cfg.fake === c || card);
    const st = cornerState[c] || (cornerState[c] = { since: null, seen: 0, card: null, fired: false });
    if (here) { st.since = st.since ?? now; st.seen = now; st.card = card || null; st.fired = true; }
    else if (st.since !== null && now - st.seen > PRESENT_S) { st.since = null; st.fired = false; st.card = null; }  // moved away
  }
}

// ======================= the sketch: a fixed-size canvas in app px, scaled to the table =======================
new p5(p => {
  const conf = [];
  p.setup = () => { p.createCanvas(10, 10).parent('sketch'); p.pixelDensity(1); };
  p.draw = () => {
    const [w, h] = sketchSize();
    if (p.width !== w || p.height !== h) {
      p.resizeCanvas(w, h); conf.length = 0;
      for (let i = 0; i < 120; i++) conf.push([p.random(p.width), p.random(p.height), p.random(10, 30), ['gold', 'hotpink', 'aquamarine', 'white'][i % 4]]);
    }
    const L = layout(), el = document.getElementById('sketch'), clip = document.getElementById('clip');
    Object.assign(clip.style, { left: L.canvas.x + 'px', top: '0px', width: L.canvas.w + 'px', height: VH() + 'px' });
    el.style.left = (L.sketch.x - L.canvas.x) + 'px'; el.style.top = L.sketch.y + 'px'; el.style.transform = `scale(${S()})`;
    clip.style.visibility = state.mode === 'calibrate' ? 'hidden' : 'visible';
    p.background('mediumblue'); p.noStroke();
    for (const c of conf) { p.fill(c[3]); p.circle((c[0] + p.frameCount * 0.3) % p.width, c[1], c[2]); }  // demo 3 style drift
  };
});

// ======================= drawing helpers =======================
const font = (px, fam = '"Geist Mono"') => `500 ${px}px ${fam}`;
function text(g, str, x, y, col = '#d4d4d8', px = cfg.textPx) { g.fillStyle = col; g.font = font(px * S()); g.textBaseline = 'middle'; g.fillText(str, x, y); return g.measureText(str).width; }
function wrap(g, str, maxW, px) { g.font = font(px * S()); const out = []; let line = '';
  for (const w of str.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  return [...out, line]; }

// Cards drawn at true size from card notation (sheets.js does the lengths and colours). 'mock' = a stand-in for a real
// card, coloured like its face; 'virtual' = a plain placeholder outline (the look of virtual cards is the card feedback ticket's).
// Returns each line's right edge, so print output can go to its right.
function drawProgram(g, prog, x0, y0, style) {
  const k = mm(), S = settings(), ends = [];
  let y = y0;
  for (const line of prog.split('\n')) {
    let xm = 0;  // mm along the line
    for (const side of parseLine(line)) {
      const w = minLength(side, S) * U;
      g.save(); g.translate(x0 + xm * k, y);
      if (style === 'virtual') {
        g.strokeStyle = '#71717a'; g.lineWidth = 1.5; g.setLineDash([6, 5]); g.strokeRect(0, 0, w * k, H * k);
      } else {
        g.strokeStyle = side.c.stripe; g.lineWidth = 1; g.strokeRect(0, 0, w * k, H * k);
        g.fillStyle = side.c.stripe; g.fillRect(MZ * k, 0, STRIPE * k, H * k);
        g.fillStyle = '#e4e4e7'; g.font = font(fsz(S) * k); g.textBaseline = 'middle';
        g.fillText(side.k === 'hw' ? side.word : side.label || '', labelX(S) * k, H / 2 * k);
        if (side.k === 'hw') { g.fillStyle = '#a1a1aa'; g.font = font(17 * k, 'Caveat'); g.fillText(side.sample, (labelX(S) + measure(side.word, fsz(S)) + S.gap + 2) * k, H / 2 * k); }
      }
      g.restore();
      xm += w + 2;
    }
    ends.push([x0 + xm * k, y + H * k / 2]);
    y += (H + 4) * k;
  }
  return ends;
}
// the mock program: one line prints, so its output shows inline to the right of the card, like Quokka
const MOCK = `[define{setup}]\n[call(p5.createCanvas)][num{500}][num{500}]\n[call(print)][str{hello}]\n\n[define{draw}]\n[call(p5.background)][color(mediumblue)]\n[call(print)][get{x}]`;
const PRINTS = { 2: () => 'hello', 6: () => 'x = ' + (Math.floor(performance.now() / 50) % 500) };

const DOC = { title: 'circle(x, y, d)', body: 'Draws a circle. x and y are where its centre goes, and d is how wide it is, in pixels.' };

// ======================= base layer: the two windows, the program, the highlight test =======================
function drawBase(L) {
  const g = base.getContext('2d'), u = UPX();
  g.setTransform(1, 0, 0, 1, 0, 0); g.setLineDash([]); g.fillStyle = '#000'; g.fillRect(0, 0, VW(), VH());
  if (state.mode === 'calibrate' || cfg.full) return;  // a full canvas window hides the coding space
  g.fillStyle = `rgb(${cfg.bg},${cfg.bg},${cfg.bg})`; g.fillRect(L.code.x, L.code.y, L.code.w, L.code.h);
  // the boundary between the windows: a card counts when its marker is on the coding space's side of it
  g.strokeStyle = '#3f3f46'; g.lineWidth = 2; g.beginPath(); g.moveTo(L.code.w, 0.5 * u); g.lineTo(L.code.w, VH() - 0.5 * u); g.stroke();

  // the program: the current page's virtual cards (placeholders), else the mock program with inline print output
  const prog = state.current && program(state.current);
  const px0 = L.code.x + 1.5 * u;
  if (prog) drawProgram(g, prog, px0, 1.5 * u, 'virtual');
  else if (cfg.program) {
    const ends = drawProgram(g, MOCK, px0, 1.5 * u, 'mock');
    for (const [i, f] of Object.entries(PRINTS)) { const [x, y] = ends[i]; text(g, '→ ' + f(), x + 0.4 * u, y, '#86efac'); }
  }

  // highlight test: red outlines of different widths around 4U card-sized slots; lay real cards in them
  if (cfg.test) {
    const ws = [0.5, 1, 2, 3], x = L.code.x + 1.5 * u, y0 = VH() * 0.55;
    ws.forEach((w, i) => { const y = y0 + i * 1.6 * u;
      g.strokeStyle = '#ef4444'; g.lineWidth = w * mm(); g.strokeRect(x, y, 4 * u, u);
      text(g, `${w} mm · bg ${cfg.bg}`, x + 4.4 * u, y + u / 2, '#ef4444'); });
  }
}

// A corner: a dotted quarter circle with its title. A card in it triggers it at once (help: the card's doc comment).
function drawCorners(g, L) {
  g.save(); g.beginPath(); g.rect(0, 0, L.W, L.H); g.clip();
  for (const c of CORNERS) {
    const what = cfg['corner_' + c]; if (what === 'none') continue;
    const [cx, cy] = L.corners[c], st = cornerState[c] || {}, R = L.R;
    g.strokeStyle = st.fired ? '#a1a1aa' : '#52525b'; g.lineWidth = 2; g.setLineDash([3, 6]); g.lineCap = 'round';
    g.beginPath(); g.arc(cx, cy, R, 0, 2 * Math.PI); g.stroke(); g.setLineDash([]); g.lineCap = 'butt';
    const right = c[1] === 'r', bottom = c[0] === 'b', m = 4 * R / (3 * Math.PI);
    g.textAlign = 'center';
    text(g, CORNER_TITLE[what], cx + (right ? -m : m), cy + (bottom ? -m : m), '#71717a');
    g.textAlign = 'left';
    if (st.fired && what === 'help') drawDoc(g, L, c, st.card);
  }
  g.restore();
}
function drawDoc(g, L, c, card) {  // the doc comment beside the corner, on a black box so it reads over the sketch
  const u = UPX(), w = 9 * u, lh = cfg.textPx * S() * 1.4, pad = 0.4 * u;
  const lines = [DOC.title + (card ? ` · card ${card.id}` : ''), ...wrap(g, DOC.body, w - 2 * pad, cfg.textPx)];
  const h = lines.length * lh + 2 * pad, [cx, cy] = L.corners[c];
  // clear of the circle by 0.5U, and of the card (its outline from the marker's angle and the card's length) by 1U
  const xs = card ? cardOutline(card).map(q => q[0]) : [];
  const x = c[1] === 'r' ? Math.min(cx - L.R - 0.5 * u, ...xs.map(v => v - u)) - w : Math.max(cx + L.R + 0.5 * u, ...xs.map(v => v + u));
  const y = c[0] === 'b' ? cy - h - 0.5 * u : cy + 0.5 * u;
  g.fillStyle = '#000'; g.fillRect(x, y, w, h); g.strokeStyle = '#52525b'; g.lineWidth = 2; g.strokeRect(x, y, w, h);
  lines.forEach((ln, i) => text(g, ln, x + pad, y + pad + i * lh + lh / 2, i ? '#d4d4d8' : '#fff'));
}
function program(key) {
  const page = book && book.pages.find(q => q.key === key);
  return page && (page.program || book.pages.find(q => q.key === page.same_as).program);
}

// ======================= top layer: page cut-outs, marker reads, status =======================
// A convex polygon grown outward by d px, corners kept sharp: each edge moved out along its normal, neighbours intersected.
function grow(pts, d) {
  if (d <= 0) return pts;
  const n = pts.length, cx = pts.reduce((a, p) => a + p[0], 0) / n, cy = pts.reduce((a, p) => a + p[1], 0) / n;
  const lines = pts.map((a, i) => {
    const b = pts[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    let nx = dy / len, ny = -dx / len;
    if ((a[0] - cx) * nx + (a[1] - cy) * ny < 0) { nx = -nx; ny = -ny; }  // point the normal away from the middle
    return [a[0] + nx * d, a[1] + ny * d, dx, dy];
  });
  return lines.map((l, i) => {
    const m = lines[(i + n - 1) % n], det = m[2] * l[3] - m[3] * l[2];
    if (Math.abs(det) < 1e-9) return [l[0], l[1]];
    const t = ((l[0] - m[0]) * l[3] - (l[1] - m[1]) * l[2]) / det;
    return [m[0] + m[2] * t, m[1] + m[3] * t];
  });
}
function drawOver(L) {
  const g = over.getContext('2d'), u = UPX();
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, VW(), VH());
  if (state.mode === 'calibrate') return drawCalib(g);
  // stacking, bottom to top: windows (base canvas, sketch) < corners < textbook pages < settings menu (its own element)
  updateCorners(L); drawCorners(g, L);
  for (const page of state.pages || []) {  // every page in view: black out the paper, its margin and a dim area around it
    const pts = page.corners.map(toPx), path = q => { g.beginPath(); q.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
    // grow the paper by (reach - radius) with sharp corners, then stroke that with round joins of the radius:
    // the dark area reaches `reach` past each edge, with corners rounded to `radius` (not to the whole reach)
    const reach = (cfg.margin + cfg.halo) * mm(), r = Math.min(cfg.radius * mm(), reach);
    path(grow(pts, reach - r)); g.fillStyle = '#000'; g.fill();
    if (r > 0) { g.strokeStyle = '#000'; g.lineJoin = 'round'; g.lineWidth = 2 * r; g.stroke(); }
    if (cfg.outline) { path(pts); g.strokeStyle = '#f43f5e'; g.lineWidth = 2; g.stroke(); }
  }
  if (cfg.marks) for (const c of state.cards || []) {  // a ring round each card marker: green counts, grey crossed is ignored
    const [x, y] = toPx(c.c), r = 11 * mm(), counts = inside(L.code, [x, y]);
    g.strokeStyle = counts ? '#22c55e' : '#71717a'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.stroke();
    if (!counts) { g.beginPath(); g.moveTo(x - r * 0.7, y - r * 0.7); g.lineTo(x + r * 0.7, y + r * 0.7); g.stroke(); }
    text(g, String(c.id), x + r + 4, y - r, counts ? '#22c55e' : '#71717a', 12);
  }
  const [sw, sh] = sketchSize();
  if (L.sketch.x < L.canvas.x || L.sketch.y < L.canvas.y || L.sketch.x + L.sketch.w > L.canvas.x + L.canvas.w + 1 || L.sketch.y + L.sketch.h > L.canvas.y + L.canvas.h + 1) {
    text(g, `sketch doesn't fit: ${(L.sketch.w / mm()).toFixed(0)} × ${(L.sketch.h / mm()).toFixed(0)} mm, canvas window ${(L.canvas.w / mm()).toFixed(0)} × ${(L.canvas.h / mm()).toFixed(0)} mm`, L.canvas.x + 0.5 * u, 1.1 * u, '#ef4444');
  }
  if (cfg.hud) {
    const cur = state.current && book && book.pages.find(q => q.key === state.current);
    text(g, `1U = ${PX_PER_U} px (${u.toFixed(1)} projector px) · ${cfg.full ? 'canvas full screen (split ' + cfg.split + '% kept)' : 'split ' + cfg.split + '%'} · sketch ${sw} × ${sh} px = ${(L.sketch.w / mm()).toFixed(0)} × ${(L.sketch.h / mm()).toFixed(0)} mm · ` +
      `text ${cfg.textPx} px = ${(cfg.textPx * S() / mm()).toFixed(1)} mm · page ${cur ? cur.name : '-'} · cards ${(state.cards || []).length}` +
      (state.calibrated === false ? ' · NOT CALIBRATED' : '') + (state.t ? '' : ' · no vision'), 0.5 * u, 0.4 * u, '#71717a', 14);
  }
}
function drawCalib(g) {
  const c = book.calib, aspect = AW() / VH();
  g.fillStyle = '#000'; g.fillRect(0, 0, VW(), VH());
  c.ids.forEach((id, i) => {
    const col = i % c.cols, row = (i / c.cols) | 0, s = c.size * VH(), cell = s / 9;
    const cx = (c.inset + col / (c.cols - 1) * (aspect - 2 * c.inset)) * VH(), cy = (c.inset + row / (c.rows - 1) * (1 - 2 * c.inset)) * VH();
    g.fillStyle = '#fff'; g.fillRect(cx - s * 0.75, cy - s * 0.75, s * 1.5, s * 1.5);
    g.fillStyle = '#000';
    TAGS[id].forEach((r, y) => [...r].forEach((b, x) => { if (b === '1') g.fillRect(cx - s / 2 + x * cell, cy - s / 2 + y * cell, cell + 0.5, cell + 0.5); }));
  });
}

// ======================= polling =======================
async function poll(file, apply, ms) {
  try { apply(await (await fetch(file + '?' + Date.now(), { cache: 'no-store' })).json()); } catch (e) { /* not there yet */ }
  setTimeout(() => poll(file, apply, ms), ms);
}
(async () => {
  try { book = await (await fetch('pages.json', { cache: 'no-store' })).json(); } catch (e) { book = null; }
  let rev = null, applied = null;
  poll('state.json', s => { state = s; }, 150);
  // control.json (over SSH) can still set anything the menu can: {"rev": n, "cfg": {"split": 60, ...}}
  poll('control.json', c => { if (rev !== null && c.rev !== rev) location.reload(); rev = c.rev; const j = JSON.stringify(c.cfg || null); if (c.cfg && j !== applied) { Object.assign(cfg, c.cfg); save(); } applied = j; }, 500);
  const frame = () => { const L = layout(); drawBase(L); drawOver(L); requestAnimationFrame(frame); };
  document.fonts.ready.then(frame);
})();
</script>
